<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nominees | Cadet TV Personality Awards 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Barlow',Arial,sans-serif;
  background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  min-height:100vh;color:#fff;
}
a{color:inherit;}

/* NAV */
.site-nav{
  position:sticky;top:0;z-index:50;
  background:rgba(15,20,40,0.85);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,215,0,0.15);
}
.nav-inner{
  max-width:1100px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.brand{
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;
  text-decoration:none;color:#FFD700;letter-spacing:.3px;white-space:nowrap;
}
.brand span{color:#fff;}
.nav-links{display:flex;gap:4px;flex-wrap:wrap;}
.nav-links a{
  text-decoration:none;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.7);
  padding:8px 12px;border-radius:8px;transition:.15s;white-space:nowrap;
}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,0.06);}
.nav-links a.active{color:#0f3460;background:#FFD700;font-weight:700;}

/* PAGE HEADER */
.page-hero{max-width:1000px;margin:0 auto;padding:40px 20px 10px;text-align:center;}
.badge{
  display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:2px;
  color:#FFD700;border:1px solid rgba(255,215,0,0.4);border-radius:20px;padding:5px 14px;
  margin-bottom:16px;text-transform:uppercase;font-weight:700;
}
.page-hero h1{
  font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.5px;
  font-size:clamp(26px,6vw,44px);line-height:1.1;text-transform:uppercase;
}
.page-hero h1 span{color:#FFD700;}
.page-hero .sub{opacity:.68;margin-top:12px;font-size:14.5px;max-width:600px;margin-left:auto;margin-right:auto;}

.wrap{max-width:1000px;margin:0 auto;padding:10px 20px 70px;}

.card{
  background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;padding:26px;margin-bottom:18px;
}
.card h2,.card h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:#FFD700;letter-spacing:.3px;}
.card h2{font-size:22px;margin-bottom:10px;text-transform:uppercase;}
.card p{line-height:1.7;opacity:.85;margin-bottom:10px;font-size:15px;}
.card p:last-child{margin-bottom:0;}

.btn{
  display:inline-block;background:linear-gradient(45deg,#FFD700,#e6a800);color:#0f3460;
  font-weight:800;text-decoration:none;padding:13px 26px;border-radius:12px;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;font-size:15px;
  text-transform:uppercase;border:none;cursor:pointer;
}
.btn.secondary{background:transparent;border:1.5px solid rgba(255,215,0,0.5);color:#FFD700;}

footer{
  text-align:center;opacity:.55;font-size:12.5px;padding:28px 20px 40px;
  border-top:1px solid rgba(255,255,255,0.08);margin-top:10px;
}
footer a{color:#9fd8ff;text-decoration:none;}

.empty,.loading{opacity:.5;text-align:center;padding:40px 0;font-size:13px;}


.cat-section{margin-bottom:30px;}
.cat-section h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:#FFD700;text-transform:uppercase;font-size:17px;margin-bottom:12px;letter-spacing:.3px;}
.nominee-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
.nominee-card{background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.1);border-radius:14px;overflow:hidden;text-align:center;}
.nominee-card img{width:100%;aspect-ratio:1;object-fit:cover;background:rgba(255,255,255,0.08);}
.nominee-card .ph{width:100%;aspect-ratio:1;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:34px;opacity:.4;}
.nominee-card .nc-body{padding:10px 8px;}
.nominee-card .nc-name{font-weight:700;font-size:13.5px;}
.nominee-card .nc-school{opacity:.55;font-size:11px;margin-top:2px;}
.nominee-card .nc-code{margin-top:6px;font-size:11px;color:#FFD700;font-weight:700;letter-spacing:.3px;}

</style>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="ctva-home.html">CTVA <span>2026</span></a>
    <div class="nav-links">
      <a class="" href="ctva-home.html">Home</a>
<a class="" href="ctva-about.html">About Us</a>
<a class="" href="ctva-vote-results.html">Vote Results</a>
<a class=" active" href="ctva-nominees.html">Nominees</a>
<a class="" href="ctva-judges-ratings.html">Judges' Ratings</a>
<a class="" href="ctva-vote-online.html">Vote Online</a>
<a class="" href="ctva-contact.html">Contact Us</a>

    </div>
  </div>
</nav>

<div class="page-hero">
  <div class="badge">Meet The Field</div>
  <h1>Our<br><span>Nominees</span></h1>
  <p class="sub">Approved nominees by category, with their official Nalo voting code.</p>
</div>
<div class="wrap">
<div id="nomineesContainer"><div class="loading">Loading nominees…</div></div>
</div>

<footer>
  Cadet TV Personality Awards 2026 · Cadet Media Ghana ·
  <a href="mailto:cadetmediaoffice@gmail.com">cadetmediaoffice@gmail.com</a>
</footer>


<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxfTkqqjtjXLXekfT-fODrdU-F3SzroDSCogLnOcICh1ImtKeLKFJK7Xb6f2K4jsQ0/exec';
  const CATEGORIES = [
  'Best International News Anchor','Best International News Reporter','Best International News Producer',
  'Best Local News Anchor','Best Local News Reporter','Best Local News Producer',
  'Best Sports News Anchor','Best Sports News Reporter','Best Sports News Producer',
  'Best Entertainment News Anchor','Best Entertainment News Reporter','Best Entertainment News Producer',
  'Best Weather Presenter','Best Weather Reporter','Best Weather Producer'
];
  const container = document.getElementById('nomineesContainer');

  async function load(){
    if (API_URL.includes('PASTE_YOUR')) {
      container.innerHTML = '<div class="empty">Backend URL not configured yet.</div>';
      return;
    }
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getRecords' })
      });
      const data = await res.json();
      const all = data.nominees || [];
      container.innerHTML = '';
      let any = false;
      CATEGORIES.forEach(cat => {
        const list = all.filter(n => n.category === cat);
        if (list.length === 0) return;
        any = true;
        const section = document.createElement('div');
        section.className = 'cat-section';
        const cards = list.map(n => {
          const photo = n.photoUrl ? `<img src="${n.photoUrl}" alt="${n.name}">` : `<div class="ph">${(n.name||'?').charAt(0).toUpperCase()}</div>`;
          return `
            <div class="nominee-card">
              ${photo}
              <div class="nc-body">
                <div class="nc-name">${n.name}</div>
                <div class="nc-school">${n.school || ''}</div>
                ${n.naloCode ? `<div class="nc-code">Nalo code: ${n.naloCode}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');
        section.innerHTML = `<h3>${cat}</h3><div class="nominee-grid">${cards}</div>`;
        container.appendChild(section);
      });
      if (!any) container.innerHTML = '<div class="empty">No approved nominees yet. Check back soon!</div>';
    } catch (err) {
      container.innerHTML = '<div class="empty">Could not load nominees. Please refresh.</div>';
    }
  }
  load();
</script>

</body>
</html>
